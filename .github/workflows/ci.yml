name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - run: zig build check --summary all
      - run: zig build --release

  claude-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - run: npm install -g @anthropic-ai/claude-code@2.1.319
      - run: zig build --release
      - run: test/claude-code.sh zig-out/bin/enforcer
